[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench-experiments"
version = "0.1.0"
description = "Mechanistic interpretability experiments against Gemma-family MLX models. Part of the mechbench repo family."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mechbench-compute>=0.11",
    "mechbench-schema>=0.14",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
# Matches the sibling repos, so `pip install -e '.[dev]'` works the
# same way everywhere.
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = []
